 <path d="M112 245v-58q25-48 50 0v58" fill="#f5c77b" opacity=".7"/>
 <g fill="url(#gold)" stroke="none"><rect x="24" y="145" width="10" height="24"/><rect x="220" y="145" width="10" height="24"/><rect x="164" y="142" width="10" height="24"/></g>
</g>
<!-- middle mountain range -->
<path d="M0 960L250 790 470 880 700 700 920 890 1130 735 1360 900 1580 720 1800 890 2030 735 2260 900 2450 760 2560 850V1250H0Z" fill="url(#mid)"/>
<path d="M0 1000Q250 850 470 940T900 930T1330 920T1770 930T2200 900T2560 940" fill="none" stroke="#8de8f5" stroke-width="8" opacity=".15"/>
