<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" role="img" aria-labelledby="title desc">
<title id="title">HOC TAP QUEST — Fantasy World Background</title>
<desc id="desc">Original vector fantasy landscape with a violet and cyan twilight sky, distant castle, layered mountains, floating islands, waterfalls, clouds and foreground cliffs. No interface, text, characters or quest markers.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#100d3d"/><stop offset=".48" stop-color="#39246f"/><stop offset="1" stop-color="#f18bba"/></linearGradient>
 <radialGradient id="aurora"><stop stop-color="#58e8f5" stop-opacity=".55"/><stop offset="1" stop-color="#58e8f5" stop-opacity="0"/></radialGradient>
 <linearGradient id="far" x2="0" y2="1"><stop stop-color="#8886ce"/><stop offset="1" stop-color="#44417f"/></linearGradient>
 <linearGradient id="mid" x2="0" y2="1"><stop stop-color="#514c9d"/><stop offset="1" stop-color="#25285f"/></linearGradient>
 <linearGradient id="near" x2="0" y2="1"><stop stop-color="#292c69"/><stop offset="1" stop-color="#101b43"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#b4faff" stop-opacity=".95"/><stop offset="1" stop-color="#38c9ed" stop-opacity="0"/></linearGradient>
 <linearGradient id="island" x2="0" y2="1"><stop stop-color="#53639e"/><stop offset=".35" stop-color="#283568"/><stop offset="1" stop-color="#111b3e"/></linearGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#ffe9a1"/><stop offset="1" stop-color="#d99b59"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="stars" width="240" height="190" patternUnits="userSpaceOnUse"><circle cx="20" cy="30" r="2" fill="#fff" opacity=".75"/><circle cx="120" cy="80" r="1.5" fill="#bdfaff" opacity=".8"/><circle cx="205" cy="22" r="1.8" fill="#fff" opacity=".65"/><circle cx="72" cy="155" r="1.2" fill="#fff" opacity=".6"/><path d="M175 125v10m-5-5h10" stroke="#d8faff" stroke-width="1.5" opacity=".65"/></pattern>
</defs>
<!-- sky and distant magical haze -->
<rect width="2560" height="1440" fill="url(#sky)"/>
<ellipse cx="1270" cy="650" rx="980" ry="360" fill="url(#aurora)" filter="url(#blur)"/>
<path d="M0 510Q420 300 820 470T1640 430T2560 390V800H0Z" fill="#8c6fbd" opacity=".16"/>
<path d="M0 640Q500 430 960 600T1840 520T2560 550" fill="none" stroke="#b9e9ff" stroke-width="5" opacity=".12"/>
<rect width="2560" height="760" fill="url(#stars)"/>
<!-- moon -->
<circle cx="1990" cy="255" r="92" fill="#c7f7ff" opacity=".12" filter="url(#blur)"/>
<circle cx="1990" cy="255" r="48" fill="#f1efff" opacity=".82"/>
<circle cx="2008" cy="240" r="48" fill="#4a367f" opacity=".52"/>
<!-- distant mountains -->
<path d="M0 850L220 650 390 760 610 535 810 760 1040 570 1260 790 1500 550 1710 760 1930 590 2180 790 2380 620 2560 760V1150H0Z" fill="url(#far)" opacity=".86"/>
<path d="M470 675l140-140 110 140-90-48-38 30-42-42zM900 700l140-130 130 150-110-55-42 35-48-40zM1370 700l130-150 130 170-110-65-40 40-48-45zM2200 735l180-115 120 140-140-48-48 35-48-42z" fill="#d4d9f4" opacity=".55"/>
<!-- far castle on central ridge -->
<g transform="translate(1130 490)" fill="#30285f" stroke="#d8c8ff" stroke-opacity=".45" stroke-width="5">
