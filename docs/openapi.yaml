openapi: 3.1.0
info:
  title: HOC TAP QUEST API
  version: 1.1.0
  description: API contract for learner accounts, lesson progress, quiz results, and XP.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://hoctap-6oeu.onrender.com/api/v1
    description: Render deployment
tags:
  - name: System
  - name: Authentication
  - name: Progress
  - name: Lessons
  - name: Quiz
paths:
  /health:
    get:
      tags: [System]
      summary: Check API and database availability
      responses:
        '200':
          description: API is available; database is connected or not configured
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version, database]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  database: { type: string, enum: [connected, disconnected, not_configured, connecting] }
                  service: { type: string, const: hoc-tap-quest-api }
                  version: { type: string }
        '503':
          description: API is running but configured database is unavailable
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version, database]
                properties:
                  status: { type: string, const: degraded }
                  service: { type: string, const: hoc-tap-quest-api }
                  version: { type: string }
                  database: { type: string, enum: [disconnected, connecting] }
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a learner account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 10, maxLength: 128, description: Maximum 72 UTF-8 bytes. }
      responses:
        '201':
          description: Account created and access token issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email is already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Access token issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Email or password is incorrect
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Too many authentication attempts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the authenticated learner account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated learner
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /progress:
    get:
      tags: [Progress]
      summary: Get the authenticated learner's saved progress
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Learner progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      tags: [Progress]
      summary: Save lesson completion and quest statuses for the authenticated learner
      description: The learner ID is derived from the verified token. Clients cannot submit totalXp or bestXpByLesson; authoritative XP is reserved for server-validated quiz attempts.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressUpdate'
      responses:
        '200':
          description: Progress saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /lessons:
    get:
      tags: [Lessons]
      summary: List published lessons (planned; not implemented yet)
      responses:
        '200':
          description: Lesson list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Lesson' }
  /quizzes/{quizId}/attempts:
    post:
      tags: [Quiz]
      summary: Submit a quiz attempt and calculate XP on the server
      description: Correct answers and lesson XP are server-controlled. Reusing the same attemptId for the same learner is idempotent and does not award XP twice. Requires MongoDB transaction support.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: quizId
          required: true
          schema: { type: string, enum: ['1', '2', '3', '4', '5', '6', '7', '8'] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [attemptId, answers]
              properties:
                attemptId: { type: string, minLength: 16, maxLength: 128, pattern: '^[a-zA-Z0-9_-]+
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthResponse:
      type: object
      required: [token, tokenType, expiresIn, user]
      properties:
        token: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, const: 3600 }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, email]
      properties:
        id: { type: string }
        email: { type: string, format: email }
    ProgressResponse:
      type: object
      required: [progress]
      properties:
        progress:
          type: object
          required: [totalXp, completedLessonIds, bestXpByLesson, questStatuses, updatedAt]
          properties:
            totalXp: { type: integer, minimum: 0 }
            completedLessonIds:
              type: array
              items: { type: integer, minimum: 1 }
            bestXpByLesson:
              type: object
              additionalProperties: { type: integer, minimum: 0 }
            questStatuses:
              type: object
              additionalProperties:
                type: string
                enum: [done, active, locked]
            updatedAt: { type: string, format: date-time }
    ProgressUpdate:
      type: object
      required: [completedLessonIds, questStatuses]
      additionalProperties: false
      properties:
        completedLessonIds:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        questStatuses:
          type: object
          maxProperties: 100
          additionalProperties:
            type: string
            enum: [done, active, locked]
    QuizAttemptResult:
      type: object
      required: [attemptId, correctCount, totalQuestions, percentage, xpAwarded, totalXp, replayed]
      properties:
        attemptId: { type: string }
        correctCount: { type: integer, minimum: 0 }
        totalQuestions: { type: integer, const: 3 }
        percentage: { type: integer, minimum: 0, maximum: 100 }
        xpAwarded: { type: integer, minimum: 0 }
        totalXp: { type: integer, minimum: 0 }
        replayed: { type: boolean }
    Lesson:
      type: object
      required: [id, title, subject, level, durationMinutes, baseXp]
      properties:
        id: { type: string }
        title: { type: string }
        subject: { type: string }
        level: { type: string }
        durationMinutes: { type: integer, minimum: 1 }
        baseXp: { type: integer, minimum: 0 }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: Database or authentication configuration unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
 }
                answers:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: object
                    additionalProperties: false
                    required: [questionId, selectedOptionId]
                    properties:
                      questionId: { type: string, enum: [q1, q2, q3] }
                      selectedOptionId: { type: string, enum: ['0', '1', '2'] }
      responses:
        '201':
          description: Attempt evaluated and saved; XP is awarded only for improvement over the learner's previous best for this lesson
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizAttemptResult' }
        '200':
          description: Idempotent replay of an attempt already saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizAttemptResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Quiz is not available
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
