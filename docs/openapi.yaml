openapi: 3.1.0
info:
  title: HOC TAP QUEST API
  version: 0.3.0
  description: API contract for authentication, learner progress, and server-authoritative quiz attempts.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://hoctap-6oeu.onrender.com/api/v1
    description: Render deployment
tags:
  - name: System
  - name: Authentication
  - name: Progress
  - name: Quiz
paths:
  /health:
    get:
      tags: [System]
      summary: Check API and database availability
      responses:
        '200':
          description: API is available and database is connected or not configured
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version, database]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  service: { type: string, const: hoc-tap-quest-api }
                  version: { type: string }
                  database: { type: string, enum: [connected, disconnected, not_configured, connecting] }
        '503':
          description: Configured database is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a learner account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 10, maxLength: 128, description: Maximum 72 UTF-8 bytes. }
      responses:
        '201':
          description: Account created and access token issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email is already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Access token issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Email or password is incorrect
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the authenticated learner account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated learner
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /progress:
    get:
      tags: [Progress]
      summary: Get the authenticated learner's saved progress
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Learner progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      tags: [Progress]
      summary: Save lesson completion and quest statuses
      description: Learner identity is derived from the verified JWT. Clients cannot submit totalXp or bestXpByLesson.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgressUpdate' }
      responses:
        '200':
          description: Progress saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /quizzes/{quizId}/attempts:
    post:
      tags: [Quiz]
      summary: Submit a quiz attempt and calculate XP on the server
      description: Correct answers and base XP are server-controlled. Reusing an attemptId for the same learner is idempotent. Requires MongoDB transaction support.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: quizId
          required: true
          schema:
            type: string
            enum: ['1', '2', '3', '4', '5', '6', '7', '8']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [attemptId, answers]
              properties:
                timezoneOffsetMinutes:
                  type: integer
                  minimum: -840
                  maximum: 840
                  description: Browser timezone offset in minutes (UTC minus local time); the server still determines the activity timestamp.
                attemptId:
                  type: string
                  minLength: 16
                  maxLength: 128
                  pattern: '^[a-zA-Z0-9_-]{16,128}$'
                answers:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items: { $ref: '#/components/schemas/SubmittedAnswer' }
      responses:
        '201':
          description: Quiz attempt saved and XP processed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizAttemptResult' }
        '200':
          description: Previously processed attempt returned without duplicate XP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizAttemptResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Quiz does not exist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required: [status, service, version, database]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string, const: hoc-tap-quest-api }
        version: { type: string }
        database: { type: string, enum: [connected, disconnected, not_configured, connecting] }
    AuthResponse:
      type: object
      required: [token, tokenType, expiresIn, user]
      properties:
        token: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, const: 3600 }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, email]
      properties:
        id: { type: string }
        email: { type: string, format: email }
    ProgressResponse:
      type: object
      required: [progress]
      properties:
        progress:
          type: object
          required: [totalXp, completedLessonIds, learningDates, dailyActivity, bestXpByLesson, questStatuses, updatedAt]
          properties:
            totalXp: { type: integer, minimum: 0 }
            completedLessonIds:
              type: array
              items: { type: integer, minimum: 1 }
            learningDates:
              type: array
              uniqueItems: true
              items: { type: string, format: date }
            dailyActivity:
              oneOf:
                - type: object
                  required: [date, completedLessonIds, highScoreLessonIds]
                  properties:
                    date: { type: string, format: date }
                    completedLessonIds:
                      type: array
                      uniqueItems: true
                      items: { type: integer, minimum: 1 }
                    highScoreLessonIds:
                      type: array
                      uniqueItems: true
                      items: { type: integer, minimum: 1 }
                - type: 'null'
            bestXpByLesson:
              type: object
              additionalProperties: { type: integer, minimum: 0 }
            questStatuses:
              type: object
              additionalProperties: { type: string, enum: [done, active, locked] }
            updatedAt: { type: string, format: date-time }
    ProgressUpdate:
      type: object
      additionalProperties: false
      required: [completedLessonIds, questStatuses]
      properties:
        completedLessonIds:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        questStatuses:
          type: object
          maxProperties: 100
          additionalProperties: { type: string, enum: [done, active, locked] }
    SubmittedAnswer:
      type: object
      additionalProperties: false
      required: [questionId, selectedOptionId]
      properties:
        questionId: { type: string, enum: [q1, q2, q3] }
        selectedOptionId: { type: string, enum: ['0', '1', '2'] }
    QuizAttemptResult:
      type: object
      required: [attemptId, correctCount, totalQuestions, percentage, xpAwarded, totalXp, replayed]
      properties:
        attemptId: { type: string }
        correctCount: { type: integer, minimum: 0, maximum: 3 }
        totalQuestions: { type: integer, const: 3 }
        percentage: { type: integer, minimum: 0, maximum: 100 }
        xpAwarded: { type: integer, minimum: 0 }
        totalXp: { type: integer, minimum: 0 }
        replayed: { type: boolean }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    BadRequest:
      description: Invalid request body or fields
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Too many authentication attempts
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: Database or required authentication configuration is unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
