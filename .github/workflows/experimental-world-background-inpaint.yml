name: Fantasy background — Round 2 LaMa Inpainting

on:
  workflow_dispatch:
    inputs:
      mask_approved:
        description: Set to yes only after reviewing the Round 1 mask artifact
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

jobs:
  inpaint:
    name: LaMa inpainting (explicit mask approval required)
    if: ${{ inputs.mask_approved == 'yes' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fantasy-game-assets-v1
      - name: Validate approved source image
        run: |
          test -f "frontend/public/assets/game/backgrounds/world/world_final.jpg"
          file "frontend/public/assets/game/backgrounds/world/world_final.jpg"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/background-lab/requirements-inpaint.txt
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install compatible LaMa dependencies
        run: |
          python -m pip install -r tools/background-lab/requirements-inpaint.txt
          python -c "import numpy, torch; from simple_lama_inpainting import SimpleLama; print('numpy', numpy.__version__, 'torch', torch.__version__)"
      - name: Run LaMa after explicit mask approval
        env:
          SOURCE_IMAGE: frontend/public/assets/game/backgrounds/world/world_final.jpg
          OUTPUT_DIR: artifacts/world-background-inpaint
          MASK_APPROVED: ${{ inputs.mask_approved }}
        run: |
          python tools/background-lab/inpaint_world.py --stage inpaint
      - name: Upload inpainting artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-background-inpaint-result
          path: artifacts/world-background-inpaint/
          if-no-files-found: error
          retention-days: 7
