name: RPG map visual QA — feature preview + staging API

on:
  push:
    branches:
      - "test/playwright-readonly-staging"
    paths:
      - ".github/workflows/rpg-map-visual-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpg-map-visual-readonly
  cancel-in-progress: false

jobs:
  visual-qa:
    name: Playwright desktop and mobile visual checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STAGING_API_HEALTH_URL: https://hoctap-staging-api.onrender.com/api/v1/health
      FEATURE_PREVIEW_URL: http://127.0.0.1:4173/
    steps:
      - name: Checkout feature source under test
        uses: actions/checkout@v4
        with:
          ref: feat/fantasy-game-assets-v1
          path: app

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies and build feature preview
        working-directory: app/frontend
        env:
          VITE_API_BASE_URL: https://hoctap-staging-api.onrender.com
        run: |
          npm install --no-package-lock
          npm run build

      - name: Start isolated feature preview
        working-directory: app/frontend
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/hq-vite-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              echo "Feature preview is responding on port 4173"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/hq-vite-preview.log
          exit 1

      - name: Install Playwright Chromium
        working-directory: app/backend
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Inspect RPG map on feature preview (staging API, read-only)
        working-directory: app/backend
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { chromium, request } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const results = [];
          const record = (id, ok, detail) => {
            results.push({ id, ok, detail });
            console.log(`${ok ? 'PASS' : 'FAIL'} | ${id} | ${detail}`);
          };
          const baseUrl = process.env.FEATURE_PREVIEW_URL;
          const apiUrl = process.env.STAGING_API_HEALTH_URL;
          const viewports = [
            { name: 'desktop', width: 1440, height: 1000, expectedAsset: 'bg-world-main.webp' },
            { name: 'mobile', width: 390, height: 844, expectedAsset: 'bg_mobile_9x16.webp' },
          ];
          let browser;

          try {
            // Read-only check of the staging API; no account or learning endpoints are called.
            const api = await request.newContext({ timeout: 45000 });
            try {
              let healthy = false;
              let detail = 'No response';
              for (let attempt = 1; attempt <= 3 && !healthy; attempt += 1) {
                try {
                  const response = await api.get(apiUrl);
                  const body = await response.json().catch(() => ({}));
                  healthy = response.status() === 200 && body.status === 'ok' &&
                    body.service === 'hoc-tap-quest-api';
                  detail = `attempt ${attempt}: HTTP ${response.status()}, status=${body.status ?? 'missing'}, service=${body.service ?? 'missing'}`;
                } catch (error) {
                  detail = `attempt ${attempt}: ${String(error).slice(0, 500)}`;
                }
                if (!healthy && attempt < 3) await new Promise(resolve => setTimeout(resolve, 3000));
              }
              record('STG-API-01', healthy, detail);
            } finally {
              await api.dispose();
            }

            browser = await chromium.launch({ headless: true });

            for (const viewport of viewports) {
              const context = await browser.newContext({
                viewport: { width: viewport.width, height: viewport.height },
                deviceScaleFactor: 1,
              });
              const page = await context.newPage();
              const pageErrors = [];
              const consoleErrors = [];
              const attemptedWrites = [];

              // Block any browser-side mutation, including accidental quiz/progress writes.
              await page.route('**/*', async route => {
                const req = route.request();
                if (!['GET', 'HEAD', 'OPTIONS'].includes(req.method())) {
                  attemptedWrites.push(`${req.method()} ${new URL(req.url()).pathname}`);
                  await route.abort('blockedbyclient');
                  return;
                }
                await route.continue();
              });
              page.on('pageerror', error => pageErrors.push(error.message));
              page.on('console', message => {
                if (message.type() === 'error') consoleErrors.push(message.text());
              });

              try {
                const response = await page.goto(baseUrl, { waitUntil: 'domcontentloaded', timeout: 30000 });
                record(`MAP-${viewport.name.toUpperCase()}-01`,
                  Boolean(response && response.status() >= 200 && response.status() < 400),
                  `feature preview HTTP ${response?.status() ?? 'no response'}; viewport=${viewport.width}x${viewport.height}`);

                await page.locator('body').waitFor({ state: 'visible', timeout: 10000 });
                const mapNav = page.getByRole('button', { name: /Bản đồ nhiệm vụ/ }).first();
                await mapNav.waitFor({ state: 'visible', timeout: 10000 });
                await mapNav.click();

                const map = page.locator('.rpg-stone-map');
                await map.waitFor({ state: 'visible', timeout: 10000 });
                await page.locator('#rpg-chapter-title').waitFor({ state: 'visible', timeout: 10000 });

                const visual = await map.evaluate(element => {
                  const rect = element.getBoundingClientRect();
                  const style = getComputedStyle(element);
                  const labels = [...element.querySelectorAll('.rpg-node-copy strong')].map(label => {
                    const labelRect = label.getBoundingClientRect();
                    const labelStyle = getComputedStyle(label);
                    return {
                      text: label.textContent?.trim() ?? '',
                      visible: labelRect.width > 0 && labelRect.height > 0 && labelStyle.visibility !== 'hidden',
                      fontSize: Number.parseFloat(labelStyle.fontSize),
                      color: labelStyle.color,
                      x: labelRect.x,
                      right: labelRect.right,
                    };
                  });
                  return {
                    backgroundImage: style.backgroundImage,
                    backgroundSize: style.backgroundSize,
                    backgroundPosition: style.backgroundPosition,
                    width: rect.width,
                    height: rect.height,
                    aspectRatio: rect.width / rect.height,
                    viewportWidth: window.innerWidth,
                    documentWidth: document.documentElement.scrollWidth,
                    labels,
                    questCount: element.querySelectorAll('.rpg-quest-row').length,
                    title: document.querySelector('#rpg-chapter-title')?.textContent?.trim() ?? '',
                  };
                });

                const expectedBackground = visual.backgroundImage.includes(viewport.expectedAsset);
                record(`MAP-${viewport.name.toUpperCase()}-02`, expectedBackground,
                  `background-image=${visual.backgroundImage}; expected=${viewport.expectedAsset}; size=${visual.backgroundSize}; position=${visual.backgroundPosition}`);

                let imageLoaded = false;
                let imageDetail = 'Expected background image URL is absent';
                if (expectedBackground) {
                  const urls = [...visual.backgroundImage.matchAll(/url\(["']?(.*?)["']?\)/g)];
                  const imagePath = urls.map(match => match[1]).find(value => value.includes(viewport.expectedAsset));
                  if (imagePath) {
                    const imageUrl = new URL(imagePath, page.url()).toString();
                    try {
                      const imageResponse = await page.request.get(imageUrl, { timeout: 30000 });
                      const contentType = imageResponse.headers()['content-type'] ?? '';
                      imageLoaded = imageResponse.status() === 200 && contentType.startsWith('image/');
                      imageDetail = `GET ${new URL(imageUrl).pathname} -> HTTP ${imageResponse.status()}, content-type=${contentType || 'missing'}`;
                    } catch (error) {
                      imageDetail = String(error).slice(0, 700);
                    }
                  }
                }
                record(`MAP-${viewport.name.toUpperCase()}-03`, imageLoaded, imageDetail);

                const noOverflow = visual.documentWidth <= visual.viewportWidth + 1;
                const mapFits = visual.width > 0 && visual.height > 0 &&
                  visual.width <= visual.viewportWidth + 1;
                record(`MAP-${viewport.name.toUpperCase()}-04`, noOverflow && mapFits,
                  `viewport=${visual.viewportWidth}px; document=${visual.documentWidth}px; map=${Math.round(visual.width)}x${Math.round(visual.height)}px; ratio=${visual.aspectRatio.toFixed(3)}`);

                const labelsReadable = visual.questCount === 4 &&
                  visual.labels.length === 4 &&
                  visual.labels.every(label => label.visible && label.text.length > 0 && label.fontSize >= 10);
                record(`MAP-${viewport.name.toUpperCase()}-05`, labelsReadable,
                  `quest nodes=${visual.questCount}; titles=${visual.labels.map(label => `${label.text} (${label.fontSize}px, ${label.color})`).join('; ')}`);

                await map.scrollIntoViewIfNeeded();
                await map.screenshot({ path: `artifacts/rpg-map-${viewport.name}.png` });
                await page.screenshot({ path: `artifacts/rpg-map-${viewport.name}-page.png`, fullPage: true });
                record(`MAP-${viewport.name.toUpperCase()}-06`, true,
                  `Captured map and full page at ${viewport.width}x${viewport.height}`);

                record(`MAP-${viewport.name.toUpperCase()}-07`, pageErrors.length === 0,
                  pageErrors.length ? pageErrors.join(' | ').slice(0, 1000) : 'No uncaught page errors observed');
                record(`MAP-${viewport.name.toUpperCase()}-08`, consoleErrors.length === 0,
                  consoleErrors.length ? consoleErrors.join(' | ').slice(0, 1000) : 'No console.error messages observed');
                record(`MAP-${viewport.name.toUpperCase()}-09`, attemptedWrites.length === 0,
                  attemptedWrites.length ? attemptedWrites.join(' | ').slice(0, 1000) : 'No mutating browser requests attempted; non-read methods are blocked');

                await writeFile(`artifacts/rpg-map-${viewport.name}-metrics.json`,
                  JSON.stringify(visual, null, 2));
              } catch (error) {
                record(`MAP-${viewport.name}-RUN`, false, String(error).slice(0, 1500));
                await page.screenshot({ path: `artifacts/rpg-map-${viewport.name}-failure.png`, fullPage: true }).catch(() => {});
              } finally {
                await context.close();
              }
            }
          } catch (error) {
            record('MAP-RUNNER', false, String(error).slice(0, 1500));
          } finally {
            if (browser) await browser.close();
          }

          await writeFile('artifacts/results.json', JSON.stringify(results, null, 2));
          const failed = results.filter(result => !result.ok);
          const passed = results.filter(result => result.ok);
          console.log(`\\nSummary: ${passed.length} PASS, ${failed.length} FAIL`);
          if (failed.length > 0) process.exitCode = 1;
          NODE

      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-map-visual-qa-feature-preview
          path: app/backend/artifacts/
          if-no-files-found: warn
          retention-days: 14
