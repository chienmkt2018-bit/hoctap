name: Quiz API idempotency and concurrency integration

on:
  workflow_dispatch:
  push:
    branches:
      - "test/playwright-readonly-staging"
    paths:
      - "backend/src/**"
      - "backend/test/quizApi.integration.test.ts"
      - "backend/package.json"
      - ".github/workflows/quiz-api-idempotency-test.yml"

permissions:
  contents: read

concurrency:
  group: quiz-api-idempotency-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quiz-api-integration:
    name: Quiz API integration on ephemeral MongoDB replica set
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/hoctap_xp_test?replicaSet=rs0

    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Start ephemeral MongoDB replica set
        run: |
          docker run --detach --name hoc-tap-quest-mongo \
            --publish 27017:27017 \
            mongo:7.0 mongod --replSet rs0 --bind_ip_all

          for attempt in $(seq 1 30); do
            if docker exec hoc-tap-quest-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs hoc-tap-quest-mongo
              echo "FAIL: ephemeral MongoDB did not become reachable."
              exit 1
            fi
            sleep 1
          done

          docker exec hoc-tap-quest-mongo mongosh --quiet --eval \
            'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})'

          for attempt in $(seq 1 30); do
            PRIMARY="$(docker exec hoc-tap-quest-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null || true)"
            if [ "$PRIMARY" = "true" ]; then
              echo "PASS: ephemeral MongoDB replica set primary is ready."
              exit 0
            fi
            sleep 1
          done

          docker logs hoc-tap-quest-mongo
          echo "FAIL: ephemeral MongoDB replica set did not elect a primary."
          exit 1

      - name: Type-check backend source
        working-directory: backend
        run: npm run typecheck

      - name: Run Quiz API idempotency and concurrency integration test
        working-directory: backend
        run: |
          mkdir -p artifacts
          set -o pipefail
          npx tsx --test test/quizApi.integration.test.ts 2>&1 | tee artifacts/quiz-api-idempotency.tap.log

      - name: Stop ephemeral MongoDB
        if: always()
        run: docker rm --force hoc-tap-quest-mongo || true

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-api-idempotency-concurrency-evidence
          path: backend/artifacts/quiz-api-idempotency.tap.log
          if-no-files-found: ignore
          retention-days: 7
