name: Quiz API idempotency and concurrency integration

on:
  workflow_dispatch:
  push:
    branches:
      - "test/playwright-readonly-staging"
    paths:
      - "backend/src/**"
      - "backend/test/quizApi.integration.test.ts"
      - "backend/package.json"
      - ".github/workflows/quiz-api-idempotency-test.yml"

permissions:
  contents: read

concurrency:
  group: quiz-api-idempotency-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quiz-api-integration:
    name: Quiz API integration on ephemeral MongoDB replica set
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/hoctap_xp_test?replicaSet=rs0
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
        command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]

    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Initialize ephemeral MongoDB replica set
        working-directory: backend
        run: |
          node --input-type=module <<'NODE'
          import mongoose from 'mongoose';

          const uri = 'mongodb://127.0.0.1:27017/admin?directConnection=true';
          await mongoose.connect(uri, { serverSelectionTimeoutMS: 10000 });
          try {
            try {
              await mongoose.connection.db.admin().command({
                replSetInitiate: {
                  _id: 'rs0',
                  members: [{ _id: 0, host: '127.0.0.1:27017' }]
                }
              });
              console.log('PASS: initialized the ephemeral MongoDB replica set.');
            } catch (error) {
              if (error.code !== 23 && !String(error.message).includes('already initialized')) {
                throw error;
              }
              console.log('INFO: replica set was already initialized.');
            }

            let primary = false;
            for (let attempt = 0; attempt < 30; attempt += 1) {
              try {
                const hello = await mongoose.connection.db.admin().command({ hello: 1 });
                if (hello.isWritablePrimary === true) {
                  primary = true;
                  break;
                }
              } catch {}
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            if (!primary) throw new Error('MongoDB replica set did not elect a primary within 30 seconds.');
            console.log('PASS: ephemeral MongoDB replica set primary is ready.');
          } finally {
            await mongoose.disconnect();
          }
          NODE

      - name: Type-check backend source
        working-directory: backend
        run: npm run typecheck

      - name: Run Quiz API idempotency and concurrency integration test
        working-directory: backend
        run: |
          mkdir -p artifacts
          set -o pipefail
          npx tsx --test test/quizApi.integration.test.ts 2>&1 | tee artifacts/quiz-api-idempotency.tap.log

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-api-idempotency-concurrency-evidence
          path: backend/artifacts/quiz-api-idempotency.tap.log
          if-no-files-found: ignore
          retention-days: 7
