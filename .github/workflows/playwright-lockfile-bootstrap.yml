name: Generate isolated Playwright lockfile

on:
  push:
    branches:
      - chore/playwright-p1-p3
    paths:
      - backend/.playwright/package.json
      - .github/workflows/playwright-lockfile-bootstrap.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate package-lock with npm
        working-directory: backend/.playwright
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --depth=0
          node -e "const p=require('./package-lock.json'); if(p.lockfileVersion !== 3) process.exit(1); if(p.packages?.['node_modules/playwright']?.version !== '1.56.1') process.exit(1); console.log('PASS | lockfile v3 | playwright 1.56.1')"

      - name: Commit generated lockfile to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/.playwright/package-lock.json
          git diff --cached --check
          git commit -m "chore(test): generate Playwright npm lockfile"
          git push origin HEAD:chore/playwright-p1-p3
