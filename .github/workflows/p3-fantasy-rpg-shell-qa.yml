name: P3 Fantasy RPG Shell QA

on:
  push:
    branches:
      - feat/p3-fantasy-rpg-shell-v1
    paths:
      - "frontend/**"
      - ".github/workflows/p3-fantasy-rpg-shell-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-fantasy-rpg-shell-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-build-and-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout P3 branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install application dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/p3-vite-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/p3-vite-preview.log
          exit 1
      - name: Verify desktop and mobile application shell
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const results = [];
          const check = (name, ok, detail) => {
            results.push({ name, status: ok ? 'PASS' : 'FAIL', detail });
            console.log(`${ok ? 'PASS' : 'FAIL'} | ${name} | ${detail}`);
          };
          try {
            for (const viewport of [
              { name: 'mobile-390x844', width: 390, height: 844, mobile: true },
              { name: 'tablet-768x1024', width: 768, height: 1024, mobile: false },
              { name: 'desktop-1440x900', width: 1440, height: 900, mobile: false },
              { name: 'desktop-1920x1080', width: 1920, height: 1080, mobile: false },
            ]) {
              const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height } });
              const pageErrors = [];
              const consoleErrors = [];
              const writes = [];
              page.on('pageerror', e => pageErrors.push(e.message));
              page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
              page.on('request', req => {
                if (!['GET', 'HEAD', 'OPTIONS'].includes(req.method())) writes.push(`${req.method()} ${req.url()}`);
              });
              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
              await page.locator('.rpg-map-screen').waitFor({ state: 'visible' });
              const data = await page.evaluate(() => {
                const visible = selector => {
                  const element = document.querySelector(selector);
                  if (!element) return false;
                  const style = getComputedStyle(element);
                  const rect = element.getBoundingClientRect();
                  return style.display !== 'none' && style.visibility !== 'hidden' && rect.width > 0 && rect.height > 0;
                };
                const sidebar = document.querySelector('.sidebar');
                const nav = document.querySelector('.nav-list');
                const brand = document.querySelector('.sidebar .brand');
                const main = document.querySelector('.main-area');
                const navRect = nav?.getBoundingClientRect();
                const brandRect = brand?.getBoundingClientRect();
                const map = document.querySelector('.rpg-stone-map')?.getBoundingClientRect();
                const aside = document.querySelector('.rpg-world-aside');
                const asideRect = aside?.getBoundingClientRect();
                return {
                  brandVisible: visible('.sidebar .brand'),
                  navVisible: visible('.nav-list'),
                  mapVisible: visible('.rpg-stone-map'),
                  asideVisible: visible('.rpg-world-aside'),
                  desktopSidebarVisible: !matchMedia('(max-width: 760px)').matches && visible('.sidebar'),
                  mobileNavFixed: matchMedia('(max-width: 760px)').matches && !!navRect && getComputedStyle(nav).position === 'fixed' && Math.abs(navRect.bottom - innerHeight) <= 2,
                  mobileBrandAtTop: matchMedia('(max-width: 760px)').matches && !!brandRect && brandRect.top >= 0 && brandRect.bottom < (map?.top ?? 0),
                  mainBottomPadding: main ? parseFloat(getComputedStyle(main).paddingBottom) : 0,
                  documentWidth: document.documentElement.scrollWidth,
                  viewportWidth: innerWidth,
                  asideWidth: asideRect ? Math.round(asideRect.width) : 0,
                  mapWidth: map ? Math.round(map.width) : 0,
                };
              });
              check(`${viewport.name} brand visible`, data.brandVisible, JSON.stringify(data));
              check(`${viewport.name} primary navigation visible`, data.navVisible, JSON.stringify(data));
              check(`${viewport.name} world map and player panel visible`, data.mapVisible && data.asideVisible, JSON.stringify(data));
              if (viewport.mobile) {
                check(`${viewport.name} fixed bottom navigation respects viewport`, data.mobileNavFixed, JSON.stringify(data));
                check(`${viewport.name} brand precedes map HUD`, data.mobileBrandAtTop, JSON.stringify(data));
                check(`${viewport.name} content reserves navigation space`, data.mainBottomPadding >= 76, `paddingBottom=${data.mainBottomPadding}px`);
              } else {
                check(`${viewport.name} desktop sidebar visible`, data.desktopSidebarVisible, JSON.stringify(data));
              }
              check(`${viewport.name} no horizontal overflow`, data.documentWidth <= viewport.width, `documentWidth=${data.documentWidth}, viewportWidth=${data.viewportWidth}`);
              check(`${viewport.name} no write requests`, writes.length === 0, writes.join(' | ') || 'No non-read-only requests');
              check(`${viewport.name} browser runtime clean`, pageErrors.length === 0 && consoleErrors.length === 0,
                [...pageErrors, ...consoleErrors].join(' | ').slice(0, 700) || 'No page or console errors');
              await page.screenshot({ path: `artifacts/${viewport.name}.png`, fullPage: true });
              await page.close();
            }
          } finally {
            await browser.close();
          }
          const failed = results.filter(item => item.status === 'FAIL');
          console.log(`\\nResult: ${results.length - failed.length} PASS, ${failed.length} FAIL`);
          console.log(JSON.stringify(results, null, 2));
          if (failed.length) process.exit(1);
          NODE
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-fantasy-rpg-shell-visual-evidence
          path: frontend/artifacts/
          if-no-files-found: warn
          retention-days: 7
