name: Frontend and backend build

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "docs/openapi.yaml"
      - "README.md"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "docs/openapi.yaml"
      - ".github/workflows/frontend-build.yml"

jobs:
  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install
      - name: Type-check and build frontend
        run: npm run build

  backend:
    name: Backend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm install
      - name: Run backend unit tests
        run: npm test
      - name: Validate OpenAPI contract
        run: npx --yes @redocly/cli lint ../docs/openapi.yaml --extends=minimal
      - name: Type-check and build backend
        run: npm run build
