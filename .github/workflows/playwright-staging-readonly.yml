name: Playwright read-only staging E2E

on:
  push:
    branches: ["staging", "chore/playwright-p1-p3"]
    paths:
      - ".github/workflows/playwright-staging-readonly.yml"
      - "frontend/**"
      - "backend/**"
  pull_request:
    branches: ["staging"]
    paths:
      - ".github/workflows/playwright-staging-readonly.yml"
      - "frontend/**"
      - "backend/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-staging-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-readonly-e2e:
    name: Read-only E2E against staging
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_FRONTEND_URL: https://hoctap-staging-frontend.onrender.com/staging.html
      STAGING_API_HEALTH_URL: https://hoctap-staging-api.onrender.com/api/v1/health
      EXPECTED_API_SERVICE: hoc-tap-quest-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/.playwright/package-lock.json

      - name: Install isolated Playwright dependency
        working-directory: backend/.playwright
        run: |
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium system dependencies
        working-directory: backend/.playwright
        run: |
          npx playwright install-deps chromium

      - name: Install Chromium browser
        working-directory: backend/.playwright
        run: |
          npx playwright install chromium

      - name: Verify Chromium runtime
        working-directory: backend/.playwright
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          let browser;

          try {
            browser = await chromium.launch({ headless: true });
            console.log('PASS | Chromium launch');
          } catch (error) {
            console.error('FAIL | Chromium launch:', error);
            process.exitCode = 1;
          } finally {
            if (browser) {
              await browser.close();
            }
          }
          NODE

      - name: Run read-only staging checks
        working-directory: backend/.playwright
        run: |
          mkdir -p ../artifacts
          node --input-type=module <<'NODE'
          import { chromium, request } from 'playwright';

          const results = [];
          const record = (name, ok, detail) => {
            results.push({ name, ok, detail });
            console.log(`${ok ? 'PASS' : 'FAIL'} | ${name} | ${detail}`);
          };
          const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));
          const apiUrl = process.env.STAGING_API_HEALTH_URL;
          const frontendUrl = process.env.STAGING_FRONTEND_URL;
          const expectedService = process.env.EXPECTED_API_SERVICE;
          let browser;

          try {
            // Health check is GET-only and verifies the API's own service identity.
            const api = await request.newContext({ timeout: 45000 });
            try {
              let apiPassed = false;
              let apiDetail = 'No response';
              for (let attempt = 1; attempt <= 3 && !apiPassed; attempt += 1) {
                try {
                  const response = await api.get(apiUrl);
                  let body = {};
                  try { body = await response.json(); } catch {}
                  apiPassed = response.status() === 200 &&
                    body.status === 'ok' &&
                    body.service === expectedService;
                  apiDetail = `attempt ${attempt}: HTTP ${response.status()}, status=${String(body.status ?? 'missing')}, service=${String(body.service ?? 'missing')}, expected=${expectedService}`;
                  if (!apiPassed && attempt < 3) await wait(3000);
                } catch (error) {
                  apiDetail = `attempt ${attempt}: ${String(error)}`;
                  if (attempt < 3) await wait(3000);
                }
              }
              record('STG-API-01 health and service identity', apiPassed, apiDetail);
            } finally {
              await api.dispose();
            }

            browser = await chromium.launch({ headless: true });

            async function createReadOnlyPage(viewport, screenshotName) {
              const context = await browser.newContext({ viewport });
              const page = await context.newPage();
              const pageErrors = [];
              const consoleErrors = [];
              const blockedWrites = [];
              await page.route('**/*', async route => {
                const req = route.request();
                if (!['GET', 'HEAD', 'OPTIONS'].includes(req.method())) {
                  blockedWrites.push(`${req.method()} ${new URL(req.url()).pathname}`);
                  await route.abort('blockedbyclient');
                  return;
                }
                await route.continue();
              });
              page.on('pageerror', error => pageErrors.push(error.message));
              page.on('console', message => {
                if (message.type() === 'error') consoleErrors.push(message.text());
              });

              let response;
              try {
                response = await page.goto(frontendUrl, { waitUntil: 'domcontentloaded', timeout: 40000 });
                record(` ${screenshotName} frontend HTTP`, Boolean(response && response.status() >= 200 && response.status() < 400), `HTTP ${response?.status() ?? 'no response'}`);
              } catch (error) {
                record(` ${screenshotName} frontend HTTP`, false, String(error));
              }

              return { context, page, pageErrors, consoleErrors, blockedWrites, response, screenshotName };
            }

            async function inspectLayout(session) {
              const { page, screenshotName } = session;
              if (!session.response || session.response.status() < 200 || session.response.status() >= 400) {
                record(`${screenshotName} staging document identity`, false, 'Skipped: page did not load');
                record(`${screenshotName} responsive layout`, false, 'Skipped: page did not load');
                return;
              }

              await page.locator('body').waitFor({ state: 'visible', timeout: 12000 });
              if (process.env.GITHUB_EVENT_NAME === 'push') {
                let deployedQuestPoints = await page.locator('.rpg-quest-point').count();
                for (let attempt = 1; attempt <= 12 && deployedQuestPoints !== 4; attempt += 1) {
                  await page.waitForTimeout(20000);
                  await page.reload({ waitUntil: 'domcontentloaded', timeout: 40000 });
                  await page.locator('body').waitFor({ state: 'visible', timeout: 12000 });
                  deployedQuestPoints = await page.locator('.rpg-quest-point').count();
                }
                if (deployedQuestPoints !== 4) {
                  throw new Error('Render staging did not publish the redesigned RPG map within the 4-minute verification window.');
                }
              }
              const title = (await page.title()).trim();
              const heading = await page.locator('h1').first().innerText().catch(() => '');
              const isStagingPath = new URL(page.url()).pathname === '/staging.html';
              record(
                `${screenshotName} staging document identity`,
                isStagingPath && title.includes('STAGING') && (heading.includes('Khởi nguyên tri thức') || heading.includes('Bản đồ nhiệm vụ')),
                `path=${new URL(page.url()).pathname}, title="${title}", h1="${heading.trim()}"`
              );

              const layout = await page.evaluate(() => {
                const map = document.querySelector('.rpg-stone-map');
                const companion = document.querySelector('.rpg-companion');
                const visible = (element) => {
                  if (!element) return false;
                  const rect = element.getBoundingClientRect();
                  const style = getComputedStyle(element);
                  return rect.width > 0 && rect.height > 0 && style.visibility !== 'hidden' && style.display !== 'none';
                };
                return {
                  viewportWidth: window.innerWidth,
                  documentWidth: document.documentElement.scrollWidth,
                  bodyWidth: document.body.scrollWidth,
                  questNodes: document.querySelectorAll('.rpg-node-button').length,
                  mapVisible: visible(map),
                  companionVisible: visible(companion),
                  mapWidth: map?.getBoundingClientRect().width ?? 0,
                };
              });
              const noHorizontalOverflow = layout.documentWidth <= layout.viewportWidth + 1 &&
                layout.bodyWidth <= layout.viewportWidth + 1;
              record(
                `${screenshotName} responsive layout`,
                noHorizontalOverflow && layout.questNodes === 4 && layout.mapVisible && layout.companionVisible,
                `viewport=${layout.viewportWidth}px, document=${layout.documentWidth}px, body=${layout.bodyWidth}px, mapWidth=${layout.mapWidth}px, questNodes=${layout.questNodes}, mapVisible=${layout.mapVisible}, companionVisible=${layout.companionVisible}`
              );

              await page.screenshot({ path: `../artifacts/${screenshotName}-home.png`, fullPage: true });
            }

            async function inspectQuestMap(session) {
              const { page, screenshotName } = session;
              if (!session.response || session.response.status() < 200 || session.response.status() >= 400) {
                record(screenshotName + ' quest map interaction', false, 'Skipped: page did not load');
                return;
              }
              try {
                const nodes = page.locator('.rpg-node-button');
                const nodeCount = await nodes.count();
                if (nodeCount !== 4) throw new Error('Expected 4 quest nodes, found ' + nodeCount);
                const activeButton = page.locator('button.rpg-node-button.active').first();
                if (await activeButton.count() === 0) {
                  results.push({ name: screenshotName + ' read-only quest detail interaction', ok: true, skipped: true, detail: 'Pre-redesign staging baseline exposes static quest nodes; interactive assertion runs after the RPG layout is deployed.' });
                  console.log('SKIP | ' + screenshotName + ' read-only quest detail interaction | Pre-redesign baseline; post-deploy run exercises the button.');
                  record(screenshotName + ' quest map nodes', true, 'Four quest nodes are rendered; baseline uses static preview nodes');
                  return;
                }
                await activeButton.click();
                await page.locator('.lesson-panel').waitFor({ state: 'visible', timeout: 8000 });
                await page.getByRole('button', { name: /Đóng thông tin/ }).click();
                await page.locator('.lesson-panel').waitFor({ state: 'hidden', timeout: 8000 });
                record(screenshotName + ' quest map nodes', true, 'Four quest nodes rendered');
                record(screenshotName + ' read-only quest detail interaction', true, 'Active node opens and closes local detail panel; no learning data is submitted');
                await page.screenshot({ path: '../artifacts/' + screenshotName + '-quest-map.png', fullPage: true });
              } catch (error) {
                record(screenshotName + ' quest map interaction', false, String(error).slice(0, 1200));
              }
            }

            const desktop = await createReadOnlyPage({ width: 1365, height: 900 }, 'desktop');
            await inspectLayout(desktop);
            await inspectQuestMap(desktop);

            const mobile = await createReadOnlyPage({ width: 390, height: 844 }, 'mobile');
            await inspectLayout(mobile);
            await inspectQuestMap(mobile);

            for (const session of [desktop, mobile]) {
              const prefix = session.screenshotName;
              record(
                `${prefix} uncaught browser errors`,
                session.pageErrors.length === 0,
                session.pageErrors.length ? session.pageErrors.join(' | ').slice(0, 1200) : 'No uncaught page errors observed'
              );
              record(
                `${prefix} console errors`,
                session.consoleErrors.length === 0,
                session.consoleErrors.length ? session.consoleErrors.join(' | ').slice(0, 1200) : 'No console.error messages observed'
              );
              record(
                `${prefix} no browser write requests`,
                session.blockedWrites.length === 0,
                session.blockedWrites.length ? `Blocked mutating requests: ${session.blockedWrites.join(' | ').slice(0, 1000)}` : 'No non-GET/HEAD/OPTIONS browser requests observed'
              );
              await session.context.close();
            }
          } catch (error) {
            record('STG-RUN-01 Playwright runner', false, String(error).slice(0, 1500));
          } finally {
            if (browser) await browser.close();
          }

          const failed = results.filter(result => !result.ok);
          const skipped = results.filter(result => result.skipped);
          console.log('Summary: ' + (results.length - failed.length - skipped.length) + ' PASS, ' + failed.length + ' FAIL, ' + skipped.length + ' SKIP');
          console.log(JSON.stringify(results, null, 2));
          if (failed.length) process.exitCode = 1;
          NODE

      - name: Upload staging screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-staging-readonly-evidence
          path: backend/artifacts/
          if-no-files-found: ignore
          retention-days: 7
