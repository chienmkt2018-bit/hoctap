name: Playwright read-only staging E2E

on:
  # Run on application/workflow changes in the isolated test branch or staging branch.
  push:
    branches:
      - "test/playwright-readonly-staging"
      - "staging"
    paths:
      - ".github/workflows/playwright-staging-readonly.yml"
      - "frontend/**"
      - "backend/**"
  # Validate changes proposed for main, not just changes to this workflow file.
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/playwright-staging-readonly.yml"
      - "frontend/**"
      - "backend/**"
  # Daily smoke check; GitHub schedules run from the default branch after merge.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-staging-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-readonly-e2e:
    name: Read-only E2E against staging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_FRONTEND_URL: https://hoctap-staging-frontend.onrender.com
      STAGING_API_HEALTH_URL: https://hoctap-staging-api.onrender.com/api/v1/health
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: backend
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run read-only staging checks
        working-directory: backend
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { chromium, request } from 'playwright';

          const results = [];
          const record = (name, ok, detail) => {
            results.push({ name, ok, detail });
            console.log(`${ok ? 'PASS' : 'FAIL'} | ${name} | ${detail}`);
          };

          const apiUrl = process.env.STAGING_API_HEALTH_URL;
          const frontendUrl = process.env.STAGING_FRONTEND_URL;
          let browser;

          try {
            const api = await request.newContext({ timeout: 45000 });
            let apiPassed = false;
            let apiDetail = 'No response';
            try {
              for (let attempt = 1; attempt <= 3 && !apiPassed; attempt += 1) {
                try {
                  const response = await api.get(apiUrl);
                  let body = {};
                  try { body = await response.json(); } catch {}
                  apiPassed = response.status() === 200 && body.status === 'ok';
                  apiDetail = `attempt ${attempt}: HTTP ${response.status()}, status=${String(body.status ?? 'missing')}`;
                  if (!apiPassed && attempt < 3) await new Promise(resolve => setTimeout(resolve, 3000));
                } catch (error) {
                  apiDetail = `attempt ${attempt}: ${String(error)}`;
                  if (attempt < 3) await new Promise(resolve => setTimeout(resolve, 3000));
                }
              }
              record('STG-API-01 health endpoint', apiPassed, apiDetail);
            } finally {
              await api.dispose();
            }

            // CORS preflight: OPTIONS must be accepted from the exact staging frontend origin.
            const corsOrigin = 'https://hoctap-staging-frontend.onrender.com';
            const corsUrl = apiUrl;
            const preflight = await request.newContext({ timeout: 30000 });
            try {
              const options = await preflight.fetch(corsUrl, {
                method: 'OPTIONS',
                headers: {
                  Origin: corsOrigin,
                  'Access-Control-Request-Method': 'GET',
                  'Access-Control-Request-Headers': 'content-type'
                }
              });
              const h = options.headers();
              const allowOrigin = h['access-control-allow-origin'] ?? '';
              const allowMethods = h['access-control-allow-methods'] ?? '';
              const allowHeaders = h['access-control-allow-headers'] ?? '';
              const preflightOk = options.status() >= 200 && options.status() < 300 &&
                allowOrigin === corsOrigin && /\bGET\b/i.test(allowMethods) &&
                /content-type/i.test(allowHeaders);
              record('CORS-01 OPTIONS preflight', preflightOk,
                `HTTP ${options.status()}; allow-origin=${allowOrigin || 'missing'}; allow-methods=${allowMethods || 'missing'}; allow-headers=${allowHeaders || 'missing'}`);

              const getResponse = await preflight.get(corsUrl, { headers: { Origin: corsOrigin } });
              const getHeaders = getResponse.headers();
              const getAllowOrigin = getHeaders['access-control-allow-origin'] ?? '';
              const getHeaderOk = getResponse.status() === 200 && getAllowOrigin === corsOrigin;
              record('CORS-03 GET response allow-origin header', getHeaderOk,
                `HTTP ${getResponse.status()}; allow-origin=${getAllowOrigin || 'missing'}`);
            } catch (error) {
              record('CORS-01 OPTIONS preflight', false, String(error).slice(0, 1000));
            } finally {
              await preflight.dispose();
            }

            browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1365, height: 900 } });
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            const browserWriteRequests = [];
            page.on('request', request => {
              if (!['GET', 'HEAD', 'OPTIONS'].includes(request.method())) {
                browserWriteRequests.push(`${request.method()} ${request.url()}`);
              }
            });
            page.on('console', message => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });

            let response;
            try {
              response = await page.goto(frontendUrl, { waitUntil: 'domcontentloaded', timeout: 30000 });
              record(
                'STG-UI-01 frontend loads',
                Boolean(response && response.status() >= 200 && response.status() < 400),
                `HTTP ${response?.status() ?? 'no response'}`
              );
            } catch (error) {
              record('STG-UI-01 frontend loads', false, String(error));
            }

            if (response && response.status() >= 200 && response.status() < 400) {
              try {
                // Real browser fetch from the approved staging frontend origin.
                try {
                  const browserFetch = await page.evaluate(async (url) => {
                    try {
                      const response = await fetch(url, { method: 'GET', mode: 'cors', credentials: 'omit' });
                      const bodyText = await response.text();
                      let bodyStatus = 'unreadable';
                      try { bodyStatus = JSON.parse(bodyText).status ?? 'missing'; } catch {}
                      return {
                        ok: response.ok,
                        status: response.status,
                        contentType: response.headers.get('content-type'),
                        bodyStatus
                      };
                    } catch (error) {
                      return { error: String(error) };
                    }
                  }, apiUrl);
                  const fetchOk = browserFetch.ok === true && browserFetch.status === 200 &&
                    browserFetch.bodyStatus === 'ok';
                  record('CORS-02 browser fetch GET', fetchOk,
                    browserFetch.error || `HTTP ${browserFetch.status}; body.status=${browserFetch.bodyStatus}; content-type=${browserFetch.contentType || 'missing'}`);
                } catch (error) {
                  record('CORS-02 browser fetch GET', false, String(error).slice(0, 1000));
                }

                await page.locator('body').waitFor({ state: 'visible', timeout: 10000 });
                const title = (await page.title()).trim();
                const bodyText = (await page.locator('body').innerText()).trim();
                record(
                  'STG-UI-02 page has title and content',
                  title.length > 0 && bodyText.length > 30,
                  `title="${title.slice(0, 100)}", visibleTextLength=${bodyText.length}`
                );

                const nav = page.getByRole('navigation', { name: 'Điều hướng chính' });
                const lessonNav = nav.getByRole('button', { name: 'Bài học', exact: true });
                const navCount = await nav.getByRole('button').count();
                record(
                  'STG-UI-03 primary navigation renders',
                  navCount > 0 && await lessonNav.isVisible().catch(() => false),
                  `visible navigation buttons=${navCount}; lesson navigation visible=${await lessonNav.isVisible().catch(() => false)}`
                );

                await page.screenshot({ path: 'artifacts/staging-home.png', fullPage: true });

                // Read-only interaction checks: no quiz answers, submissions, or account actions.
                let lessonsOpened = false;
                try {
                  await lessonNav.click();
                  const library = page.getByRole('region', { name: 'Thư viện bài học' });
                  await library.waitFor({ state: 'visible', timeout: 10000 });
                  const lessonHeading = library.getByRole('heading', { name: 'Khám phá bài học', exact: true });
                  await lessonHeading.waitFor({ state: 'visible', timeout: 10000 });
                  const firstAvailableCard = library.locator('.lesson-card-available').filter({ has: page.getByRole('heading', { name: 'Khởi động tư duy', exact: true }) }).first();
                  const detailButton = firstAvailableCard.getByRole('button', { name: /Xem chi tiết/ });
                  await detailButton.click();
                  await library.getByRole('heading', { name: 'Chi tiết bài học', exact: true }).waitFor({ state: 'visible', timeout: 10000 });
                  await library.getByRole('heading', { name: 'Khởi động tư duy', exact: true }).waitFor({ state: 'visible', timeout: 10000 });
                  lessonsOpened = true;
                  record(
                    'STG-LESSON-01 navigate and open available lesson',
                    true,
                    'Clicked Bài học; lesson library and Khởi động tư duy detail rendered; quiz was not started'
                  );
                  await library.getByRole('button', { name: /Quay lại danh sách/ }).click();
                  await library.getByRole('heading', { name: 'Khám phá bài học', exact: true }).waitFor({ state: 'visible', timeout: 10000 });
                } catch (error) {
                  record('STG-LESSON-01 navigate and open available lesson', false, String(error).slice(0, 1000));
                }

                if (lessonsOpened) {
                  try {
                    const library = page.getByRole('region', { name: 'Thư viện bài học' });
                    const lockedCard = library.locator('.lesson-card-locked').filter({ has: page.getByRole('heading', { name: 'Thử thách nhanh', exact: true }) }).first();
                    const lockedButton = lockedCard.getByRole('button', { name: /Đang khóa/ });
                    const lockedCardVisible = await lockedCard.isVisible();
                    const lockedButtonVisible = await lockedButton.isVisible();
                    await lockedButton.click();
                    const lockNotice = page.getByRole('status').filter({ hasText: 'Bài học này đang khóa' });
                    await lockNotice.waitFor({ state: 'visible', timeout: 5000 });
                    const detailStillClosed = await library.getByRole('heading', { name: 'Chi tiết bài học', exact: true }).count() === 0;
                    record(
                      'STG-LESSON-02 locked lesson remains inaccessible',
                      lockedCardVisible && lockedButtonVisible && detailStillClosed,
                      `locked card visible=${lockedCardVisible}; locked action visible=${lockedButtonVisible}; detail remained closed=${detailStillClosed}; lock notice shown=true`
                    );
                  } catch (error) {
                    record('STG-LESSON-02 locked lesson remains inaccessible', false, String(error).slice(0, 1000));
                  }
                } else {
                  record('STG-LESSON-02 locked lesson remains inaccessible', false, 'Skipped because lesson navigation/detail test did not pass');
                }

                // Repeat the read-only lesson flow at a mobile viewport.
                try {
                  await page.setViewportSize({ width: 390, height: 844 });
                  const library = page.getByRole('region', { name: 'Thư viện bài học' });
                  await library.getByRole('heading', { name: 'Khám phá bài học', exact: true }).waitFor({ state: 'visible', timeout: 10000 });
                  const availableCard = library.locator('.lesson-card-available').filter({ has: page.getByRole('heading', { name: 'Khởi động tư duy', exact: true }) }).first();
                  await availableCard.getByRole('button', { name: /Xem chi tiết/ }).click();
                  await library.getByRole('heading', { name: 'Chi tiết bài học', exact: true }).waitFor({ state: 'visible', timeout: 10000 });
                  await library.getByRole('button', { name: /Quay lại danh sách/ }).click();
                  await library.getByRole('heading', { name: 'Khám phá bài học', exact: true }).waitFor({ state: 'visible', timeout: 10000 });
                  const mobileLocked = library.locator('.lesson-card-locked').filter({ has: page.getByRole('heading', { name: 'Thử thách nhanh', exact: true }) }).first();
                  const mobileLockedVisible = await mobileLocked.isVisible();
                  const mobileWidth = await page.evaluate(() => ({ viewport: window.innerWidth, document: document.documentElement.scrollWidth }));
                  record('STG-LESSON-03 mobile navigation and lock state', mobileLockedVisible && mobileWidth.document <= mobileWidth.viewport,
                    `viewport=${mobileWidth.viewport}; document=${mobileWidth.document}; locked card visible=${mobileLockedVisible}`);
                } catch (error) {
                  record('STG-LESSON-03 mobile navigation and lock state', false, String(error).slice(0, 1000));
                }
              } catch (error) {
                record('STG-UI-02/03 page content and navigation', false, String(error));
              }
            } else {
              record('STG-UI-02 page has title and content', false, 'Skipped because frontend did not load');
              record('STG-UI-03 navigation/link controls render', false, 'Skipped because frontend did not load');
            }

            record(
              'STG-UI-04 uncaught browser errors',
              pageErrors.length === 0,
              pageErrors.length ? pageErrors.join(' | ').slice(0, 1200) : 'No uncaught page errors observed'
            );
            record(
              'STG-UI-05 console errors',
              consoleErrors.length === 0,
              consoleErrors.length ? consoleErrors.join(' | ').slice(0, 1200) : 'No console.error messages observed'
            );

            record(
              'STG-SAFE-01 no browser write requests',
              browserWriteRequests.length === 0,
              browserWriteRequests.length ? browserWriteRequests.join(' | ').slice(0, 1200) : 'No non-GET/HEAD/OPTIONS browser requests observed'
            );

            await page.close();
          } catch (error) {
            record('STG-RUN-01 Playwright runner', false, String(error));
          } finally {
            if (browser) await browser.close();
          }

          const failed = results.filter(result => !result.ok);
          console.log(`\nSummary: ${results.length - failed.length} PASS, ${failed.length} FAIL`);
          if (failed.length) process.exitCode = 1;
          NODE

      - name: Upload staging screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-staging-readonly-evidence
          path: backend/artifacts/
          if-no-files-found: ignore
          retention-days: 7
