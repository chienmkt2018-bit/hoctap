name: Playwright read-only staging E2E

on:
  push:
    branches: ["staging"]
    paths:
      - ".github/workflows/playwright-staging-readonly.yml"
      - "frontend/**"
      - "backend/**"
  pull_request:
    branches: ["staging"]
    paths:
      - ".github/workflows/playwright-staging-readonly.yml"
      - "frontend/**"
      - "backend/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-staging-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-readonly-e2e:
    name: Read-only E2E against staging
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      STAGING_FRONTEND_URL: https://hoctap-staging-frontend.onrender.com/staging.html
      STAGING_API_HEALTH_URL: https://hoctap-staging-api.onrender.com/api/v1/health
      EXPECTED_API_SERVICE: hoc-tap-quest-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: backend
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run read-only staging checks
        working-directory: backend
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { chromium, request } from 'playwright';

          const results = [];
          const record = (name, ok, detail) => {
            results.push({ name, ok, detail });
            console.log(\`\${ok ? 'PASS' : 'FAIL'} | \${name} | \${detail}\`);
          };
          const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));
          const apiUrl = process.env.STAGING_API_HEALTH_URL;
          const frontendUrl = process.env.STAGING_FRONTEND_URL;
          const expectedService = process.env.EXPECTED_API_SERVICE;
          let browser;

          try {
            // Health check is GET-only and verifies the API's own service identity.
            const api = await request.newContext({ timeout: 45000 });
            try {
              let apiPassed = false;
              let apiDetail = 'No response';
              for (let attempt = 1; attempt <= 3 && !apiPassed; attempt += 1) {
                try {
                  const response = await api.get(apiUrl);
                  let body = {};
                  try { body = await response.json(); } catch {}
                  apiPassed = response.status() === 200 &&
                    body.status === 'ok' &&
                    body.service === expectedService;
                  apiDetail = \`attempt \${attempt}: HTTP \${response.status()}, status=\${String(body.status ?? 'missing')}, service=\${String(body.service ?? 'missing')}, expected=\${expectedService}\`;
                  if (!apiPassed && attempt < 3) await wait(3000);
                } catch (error) {
                  apiDetail = \`attempt \${attempt}: \${String(error)}\`;
                  if (attempt < 3) await wait(3000);
                }
              }
              record('STG-API-01 health and service identity', apiPassed, apiDetail);
            } finally {
              await api.dispose();
            }

            browser = await chromium.launch({ headless: true });

            async function createReadOnlyPage(viewport, screenshotName) {
              const context = await browser.newContext({ viewport });
              const page = await context.newPage();
              const pageErrors = [];
              const consoleErrors = [];
              const blockedWrites = [];
              await page.route('**/*', async route => {
                const req = route.request();
                if (!['GET', 'HEAD', 'OPTIONS'].includes(req.method())) {
                  blockedWrites.push(\`\${req.method()} \${new URL(req.url()).pathname}\`);
                  await route.abort('blockedbyclient');
                  return;
                }
                await route.continue();
              });
              page.on('pageerror', error => pageErrors.push(error.message));
              page.on('console', message => {
                if (message.type() === 'error') consoleErrors.push(message.text());
              });

              let response;
              try {
                response = await page.goto(frontendUrl, { waitUntil: 'domcontentloaded', timeout: 40000 });
                record(\` \${screenshotName} frontend HTTP\`, Boolean(response && response.status() >= 200 && response.status() < 400), \`HTTP \${response?.status() ?? 'no response'}\`);
              } catch (error) {
                record(\` \${screenshotName} frontend HTTP\`, false, String(error));
              }

              return { context, page, pageErrors, consoleErrors, blockedWrites, response, screenshotName };
            }

            async function inspectLayout(session) {
              const { page, screenshotName } = session;
              if (!session.response || session.response.status() < 200 || session.response.status() >= 400) {
                record(\`\${screenshotName} staging document identity\`, false, 'Skipped: page did not load');
                record(\`\${screenshotName} responsive layout\`, false, 'Skipped: page did not load');
                return;
              }

              await page.locator('body').waitFor({ state: 'visible', timeout: 12000 });
              const title = (await page.title()).trim();
              const heading = await page.locator('h1').first().innerText().catch(() => '');
              const isStagingPath = new URL(page.url()).pathname === '/staging.html';
              record(
                \`\${screenshotName} staging document identity\`,
                isStagingPath && title.includes('STAGING') && heading.includes('cuộc phiêu lưu học tập'),
                \`path=\${new URL(page.url()).pathname}, title="\${title}", h1="\${heading.trim()}"\`
              );

              const layout = await page.evaluate(() => ({
                viewportWidth: window.innerWidth,
                documentWidth: document.documentElement.scrollWidth,
                bodyWidth: document.body.scrollWidth,
                navButtons: [...document.querySelectorAll('.staging-nav button')].filter(el => {
                  const rect = el.getBoundingClientRect();
                  const style = getComputedStyle(el);
                  return rect.width > 0 && rect.height > 0 && style.visibility !== 'hidden';
                }).map(el => el.innerText.trim()),
                healthText: document.querySelector('.staging-health-card')?.innerText ?? '',
              }));
              const noHorizontalOverflow = layout.documentWidth <= layout.viewportWidth + 1 &&
                layout.bodyWidth <= layout.viewportWidth + 1;
              record(
                \`\${screenshotName} responsive layout\`,
                noHorizontalOverflow && layout.navButtons.length === 3,
                \`viewport=\${layout.viewportWidth}px, document=\${layout.documentWidth}px, body=\${layout.bodyWidth}px, visible nav=[\${layout.navButtons.join(', ')}]\`
              );

              await page.screenshot({ path: \`artifacts/\${screenshotName}-home.png\`, fullPage: true });
            }

            async function inspectNavigation(session) {
              const { page, screenshotName } = session;
              if (!session.response || session.response.status() < 200 || session.response.status() >= 400) {
                record(\`\${screenshotName} section navigation\`, false, 'Skipped: page did not load');
                return;
              }
              try {
                await page.getByRole('button', { name: /Bản đồ nhiệm vụ/ }).first().click();
                await page.getByRole('heading', { name: 'Bản đồ nhiệm vụ', exact: true }).waitFor({ state: 'visible', timeout: 8000 });
                const questText = await page.locator('.staging-quest-list').innerText();
                if (!questText.includes('Khởi động tư duy')) throw new Error('Quest preview content missing');

                await page.getByRole('button', { name: /Bài học/ }).first().click();
                await page.getByRole('heading', { name: 'Thư viện bài học', exact: true }).waitFor({ state: 'visible', timeout: 8000 });
                const lessonText = await page.locator('.staging-lesson-grid').innerText();
                if (!lessonText.includes('Khởi động tư duy')) throw new Error('Lesson preview content missing');

                await page.getByRole('button', { name: /Tổng quan/ }).first().click();
                await page.getByRole('heading', { name: 'Hành trình của bạn', exact: true }).waitFor({ state: 'visible', timeout: 8000 });
                await page.screenshot({ path: \`artifacts/\${screenshotName}-navigation.png\`, fullPage: true });
                record(\`\${screenshotName} section navigation\`, true, 'Overview → Quest Map → Lesson Library → Overview; preview content verified');
              } catch (error) {
                record(\`\${screenshotName} section navigation\`, false, String(error).slice(0, 1200));
              }
            }

            const desktop = await createReadOnlyPage({ width: 1365, height: 900 }, 'desktop');
            await inspectLayout(desktop);
            await inspectNavigation(desktop);

            const mobile = await createReadOnlyPage({ width: 390, height: 844 }, 'mobile');
            await inspectLayout(mobile);
            await inspectNavigation(mobile);

            for (const session of [desktop, mobile]) {
              const prefix = session.screenshotName;
              record(
                \`\${prefix} uncaught browser errors\`,
                session.pageErrors.length === 0,
                session.pageErrors.length ? session.pageErrors.join(' | ').slice(0, 1200) : 'No uncaught page errors observed'
              );
              record(
                \`\${prefix} console errors\`,
                session.consoleErrors.length === 0,
                session.consoleErrors.length ? session.consoleErrors.join(' | ').slice(0, 1200) : 'No console.error messages observed'
              );
              record(
                \`\${prefix} no browser write requests\`,
                session.blockedWrites.length === 0,
                session.blockedWrites.length ? \`Blocked mutating requests: \${session.blockedWrites.join(' | ').slice(0, 1000)}\` : 'No non-GET/HEAD/OPTIONS browser requests observed'
              );
              await session.context.close();
            }
          } catch (error) {
            record('STG-RUN-01 Playwright runner', false, String(error).slice(0, 1500));
          } finally {
            if (browser) await browser.close();
          }

          const failed = results.filter(result => !result.ok);
          console.log(\`\\nSummary: \${results.length - failed.length} PASS, \${failed.length} FAIL\`);
          console.log(JSON.stringify(results, null, 2));
          if (failed.length) process.exitCode = 1;
          NODE

      - name: Upload staging screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-staging-readonly-evidence
          path: backend/artifacts/
          if-no-files-found: ignore
          retention-days: 7
